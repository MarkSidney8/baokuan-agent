{% extends "layout.html" %}
{% block title %}录入复盘数据 - 爆款带货智能体工作台{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">➕ 录入复盘数据</h1>
<div class="card max-w-2xl">
<form method="post" action="/stats/new" class="space-y-4">
  <div class="grid grid-cols-2 gap-4">
    <div><label class="lbl">关联制作单</label>
      <select name="script_id" class="field">
        <option value="">不关联</option>
        {% for s in scripts %}<option value="{{ s.id }}">#{{ s.id }} {{ s.product_name }}</option>{% endfor %}
      </select></div>
    <div><label class="lbl">数据日期</label><input name="stat_date" type="date" value="{{ today }}" class="field"></div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="lbl">播放量</label><input name="play_count" type="number" value="0" min="0" class="field"></div>
    <div><label class="lbl">完播率（%）</label><input name="finish_rate" type="number" step="0.1" value="0" min="0" max="100" class="field"></div>
  </div>
  <div class="grid grid-cols-3 gap-4">
    <div><label class="lbl">商品点击率（%）</label><input name="click_rate" type="number" step="0.1" value="0" min="0" max="100" class="field"></div>
    <div><label class="lbl">成交单数</label><input name="orders" type="number" value="0" min="0" class="field"></div>
    <div><label class="lbl">GPM</label><input name="gpm" type="number" step="0.1" value="0" min="0" class="field"></div>
  </div>
  <div class="flex gap-3">
    <button name="action" value="diagnose" class="btn btn-green">🤖 AI 诊断并保存</button>
    <button name="action" value="save" class="btn btn-gray">仅保存</button>
    <a href="/stats" class="btn btn-gray">返回</a>
  </div>
  <div class="text-xs text-slate-400">诊断基准：完播率&lt;15% 看前3秒钩子；有点击无转化看价格/信任话术</div>
</form>
</div>
{% endblock %}
