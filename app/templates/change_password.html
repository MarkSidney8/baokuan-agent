{% extends "layout.html" %}
{% block title %}修改密码 - 爆款带货智能体工作台{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">🔑 修改密码</h1>
{% if tip %}<div class="mb-4 p-3 rounded bg-yellow-100 text-yellow-800 text-sm">{{ tip }}</div>{% endif %}
{% if msg=='old_err' %}<div class="mb-4 p-3 rounded bg-red-100 text-red-800 text-sm">原密码不正确</div>{% endif %}
{% if msg=='len_err' %}<div class="mb-4 p-3 rounded bg-red-100 text-red-800 text-sm">新密码至少6位</div>{% endif %}
{% if msg=='diff_err' %}<div class="mb-4 p-3 rounded bg-red-100 text-red-800 text-sm">两次输入的新密码不一致</div>{% endif %}
<div class="card max-w-md">
<form method="post" action="/change-password" class="space-y-4">
  <div><label class="lbl">原密码</label><input name="old_password" type="password" required class="field"></div>
  <div><label class="lbl">新密码（至少6位）</label><input name="new_password" type="password" required class="field"></div>
  <div><label class="lbl">确认新密码</label><input name="new_password2" type="password" required class="field"></div>
  <button class="btn btn-primary">确认修改</button>
</form>
</div>
{% endblock %}
