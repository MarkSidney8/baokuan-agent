<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 爆款带货智能体工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
<div class="bg-white rounded-xl shadow-xl p-8 w-96">
  <div class="text-2xl font-bold text-center mb-2">🔥 爆款带货工作台</div>
  <div class="text-sm text-slate-500 text-center mb-6">团队登录</div>
  {% if msg %}<div class="mb-4 p-3 rounded bg-red-100 text-red-800 text-sm">{{ msg }}</div>{% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm text-slate-600 mb-1">用户名</label>
      <input name="username" required class="w-full border rounded-lg px-3 py-2" placeholder="admin">
    </div>
    <div>
      <label class="block text-sm text-slate-600 mb-1">密码</label>
      <input name="password" type="password" required class="w-full border rounded-lg px-3 py-2" placeholder="初始密码 admin123">
    </div>
    <button class="w-full bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700">登录</button>
  </form>
  <div class="text-xs text-slate-400 text-center mt-4">首次登录 admin / admin123，需立即改密码</div>
</div>
</body>
</html>
